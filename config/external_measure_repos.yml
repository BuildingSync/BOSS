# External non-gem measure repositories.
#
# Precedence in workflow measure lookup is:
# 1) local_measure_roots below
# 2) gem-provided measure dirs
# 3) external repos listed here
#
# local_measure_roots are resolved relative to this file.
# The default shipped configuration keeps this repository's local measures first.
local_measure_roots:
  - ../lib/measures

# For each repo:
# - name: local checkout folder name under vendor/external_measures
# - url: git repository URL
# - ref: pinned tag/branch/commit to checkout
# - local_path (instead of url/ref): existing local checkout, relative to this file.
#   BOSS uses it in place and never runs Git against it; a missing path is an error.
# - measure_roots: one or more paths inside the repo that contain measure directories
# - scenario_only (optional, default false): when true, measure roots are added only to
#   scenario workflows (scenarios/<id>/in.osw), never to baseline/in.osw
#

# The below measures are needed for the BOSS L200 workflow.
repos:
  - name: comstock
    url: https://github.com/NatLabRockies/comstock.git
    ref: main
    measure_roots:
      - measures
      - resources/measures

  # BuildingSync measures used by scenario mappings. Not released as a gem, so BOSS
  # loads the sibling checkout ../buildingsync-measures-gem (CI pins its commit).
  - name: buildingsync-measures-gem
    local_path: ../../buildingsync-measures-gem
    measure_roots:
      - lib/measures
    scenario_only: true
